# dmarcd: polls the report mailbox and emails a readable digest.
#   cp example.env .env   # fill in
#   docker compose up -d
name: dmarcd

services:
  dmarcd:
    build: .
    image: dmarcd:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - dmarcd_data:/data
    # For testing against a local mail catcher on the host (SMTP_HOST=host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  dmarcd_data:
