# epaphras: polls the report mailbox and emails a readable digest.
#   cp example.env .env   # fill in
#   docker compose up -d
name: epaphras

services:
  epaphras:
    build: .
    image: epaphras:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - epaphras_data:/data
    # For testing against a local mail catcher on the host (SMTP_HOST=host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  epaphras_data:
