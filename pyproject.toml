[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmarcd"
version = "0.3.0"
description = "Poll a DMARC report mailbox and email a human-readable digest with action items"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
dmarcd = "dmarcd.__main__:main"

[tool.setuptools]
packages = ["dmarcd"]
